<h2>User Dashboard</h2>

<button (click)="reload()">Reload Users</button>

<div *ngIf="loading()">Loading users...</div>

<div *ngIf="error()">Error loading users</div>

<ul>
  <li *ngFor="let user of users()">
    <b>{{ user.name }}</b> — {{ user.email }}
  </li>

<input placeholder="Name" (input)="newName.set($any($event.target).value)" />
<input placeholder="Email" (input)="newEmail.set($any($event.target).value)" />
<button (click)="addUser()">Add User</button>

</ul>
